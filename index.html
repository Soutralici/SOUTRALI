<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e85d0c">
<meta name="description" content="Soutrali : trouve ou publie un petit boulot à Abidjan.">
<title>Soutrali – Petits boulots à Abidjan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>window.KLATE=1;try{var t=localStorage.getItem("sou_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
#ld{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg,#fff);transition:opacity .45s ease}
#ld.off{opacity:0;pointer-events:none}
#ld .wr{position:relative;padding:0 0 .3em;font-size:clamp(40px,14vw,72px)}
#ld .wd{display:flex;font:800 1em/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.03em}
#ld .wd span{position:relative;display:inline-block;color:var(--or,#e85d0c);animation:ldIn .35s ease-out both;animation-delay:calc(var(--i)*70ms)}
#ld .wd span::after{content:attr(data-l);position:absolute;left:0;top:0;color:#ffb27f;opacity:0;animation:ldGl 1.4s ease-in-out infinite;animation-delay:calc(.9s + var(--i)*70ms)}
#ld .ln{position:absolute;left:0;bottom:.12em;width:100%;height:.07em;border-radius:.04em;background:var(--or,#e85d0c);transform-origin:left;animation:ldLn .5s ease .45s both}
@keyframes ldIn{from{opacity:0;transform:translateY(.25em)}to{opacity:1;transform:none}}
@keyframes ldGl{0%,55%,100%{opacity:0}25%{opacity:1}}
@keyframes ldLn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#ld *,#ld *::after{animation:none!important}}
</style>
<noscript><style>#ld{display:none}</style></noscript>
</head>
<body>
<div id="ld" role="status" aria-label="Chargement de Soutrali"><div class="wr"><div class="wd" aria-hidden="true"><span style="--i:0" data-l="S">S</span><span style="--i:1" data-l="o">o</span><span style="--i:2" data-l="u">u</span><span style="--i:3" data-l="t">t</span><span style="--i:4" data-l="r">r</span><span style="--i:5" data-l="a">a</span><span style="--i:6" data-l="l">l</span><span style="--i:7" data-l="i">i</span></div><div class="ln" aria-hidden="true"></div></div></div>
<header class="hd">
<span class="brand"><svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff"/><path d="M59.96 28.64A13 13 0 1 0 50 50A13 13 0 1 1 40.04 71.36" fill="none" stroke="#e85d0c" stroke-width="9" stroke-linecap="round"/></svg>Soutrali</span>
<span class="hr"><button class="hbtn ib" id="th" data-act="theme" aria-label="Changer de mode"></button><button class="hbtn" id="acc" data-act="hdr">Connexion</button></span>
</header>
<main id="app"><p class="sub load">Chargement…</p></main>
<footer class="ft"><button class="lnk" data-go="how">Comment ça marche</button><a href="legal.html#conditions">Conditions d’utilisation</a><a href="legal.html#confidentialite">Confidentialité</a></footer>
<nav class="bar" id="bar" aria-label="Navigation principale"></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
<script src="app6.js"></script>
<script>K.boot();</script>
<script>
(function(){
var sp=document.getElementById('ld'),app=document.getElementById('app'),t0=Date.now(),done=false;
function hide(){
if(done||!sp)return;
done=true;
setTimeout(function(){
sp.className='off';
setTimeout(function(){sp.remove();},500);
},Math.max(0,1000-(Date.now()-t0)));
}
if(!sp||!app)return;
new MutationObserver(function(){if(!app.querySelector('.load'))hide();}).observe(app,{childList:true,subtree:true});
if(!app.querySelector('.load'))hide();
setTimeout(hide,12000);
})();
</script>
</body>
  </html>
